name: Daily Science News Parser

on:
  schedule:
    - cron: '0 8 * * *'  # Запуск каждый день в 8:00 утра UTC
  workflow_dispatch:     # Позволяет запустить вручную кнопкой на GitHub

jobs:
  build-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Разрешаем скрипту сохранять файлы в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 feedparser

      - name: Run parser script
        run: |
          python parser.py

      - name: Commit and push news report
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add news_report.txt || true
          git commit -m "Auto-update daily science news report" || true
          git push
          
        
